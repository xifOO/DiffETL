[project]
name = "diffetl"
version = "0.1.0"
requires-python = ">=3.11, <3.15"


[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9",
  "F",
  "I",
  "B", 
  "A",
  "C4",
  "S",
]
ignore = ["F841", "C416"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.format]
quote-style = "double" 
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
[tool.poetry.dependencies]
gitpython = "^3.1.61"
requests = "^2.34.2"
clickhouse-connect = "^1.7.2"

[dependency-groups]
dev = [
    "gitk (>=0.1.3,<0.2.0)",
    "requests-cache (>=1.3.3,<2.0.0)"
]
